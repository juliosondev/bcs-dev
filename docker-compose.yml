services:
  # API Laravel
  backend:
    build: ./backend
    container_name: bcs_backend
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: bcs
      DB_USERNAME: root
      DB_PASSWORD: 
    networks:
      - bcs

  # Frontend React + Vite
  frontend:
    build: ./frontend
    container_name: bcs_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5174:5174"
    environment:
      # Encaminha /api para o serviço backend dentro da rede do compose
      VITE_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend
    networks:
      - bcs

  # Banco de dados
  db:
    image: mysql:8.0
    container_name: bcs_db
    ports:
      - "3308:3306"
    environment:
      MYSQL_DATABASE: bcs
      MYSQL_USER: bcs
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - bcs_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - bcs

volumes:
  bcs_db_data:

networks:
  bcs:
    driver: bridge
